<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@gh-pages/examples/js/remix-dropdown.js"></script>
    <script src="scripts/objeto-interactivo.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
    
  </head>
  <body>
    <a-scene>
        <a-assets>
            
            <a-asset-item id="escena2" src="modelos/escena2.glb"></a-asset-item>
            <a-asset-item id="cuaderno" src="modelos/cuaderno.glb"></a-asset-item>

        </a-assets>

    
        <!--Imagen 360 -->
        <a-sky src="img/imagen360.png" rotation="0 -130 0"></a-sky>


        <a-entity gltf-model="#escena2" position="20.713 0 -54.71" scale="1 1 1" static-body></a-entity>

       <!-- Cámara -->
        <a-entity id="camara" camera look-controls wasd-controls kinematic-body position="-6 1.6 -0.090" rotation="90 0 0">
            <a-cursor raycaster="objects: [link], a-link, .raycastable"></a-cursor>
 
          <!-- Panel HUD Fijo -->
            <a-entity id="hud"
          hud-panel
          position="0 0 -1.2"
          visible="false">

            <!-- Fondo del Panel (Ancho: 1.0, Alto: 1.2) -->
            <a-plane class="hud-fondo"
                    color="#1a1a1a" opacity="0.95"
                    width="1.0" height="1.2"
                    position="0 0 0"></a-plane>

            <!-- Imagen Superior (Ancho: 0.9, centrada) -->
            <a-entity class="hud-imagen"
                      geometry="primitive: plane; width: 0.9; height: 0.5"
                      material="shader: flat; transparent: true"
                      position="0 0.28 0.01"
                      visible="false"></a-entity>

            <!-- Título (Centrado en X=-0.42 con respecto al borde del plano, Z=0.01) -->
            <a-entity class="hud-titulo"
                      position="-0.05 -0.03 0.01"
                      text="value: ; color: #FFFFFF; width: 0.84; wrapCount: 28; align: left; baseline: top; font: roboto"></a-entity>

            <!-- Descripción (Inicia debajo del título, Z=0.01) -->
            <a-entity class="hud-texto"
                      position=" 0.036 -0.1 0.070"
                      text="value: ; color: #CCCCCC; width: 0.84; wrapCount: 30; align: left; baseline: top; font: roboto"></a-entity>
          </a-entity>
        </a-entity>
        <!-- /hud-->


        <!--- Cuaderno 1 -->
         <a-entity id="cuadernoObjeto1" 
                  gltf-model="#cuaderno"
                  position="-3 0 0" 
                  scale="0.5 0.5 0.5"
                  rotation="0 0 0"
                  class="raycastable"
                  objeto-interactivo="titulo: recursos; texto: solia robar de campamentos cercanos y un sitio donde familias solian hospedarse cada verano, habia gran cantidad de alimentos y me aseguraba de dejar todo en su sitio antes de irme; imagen: img/img5.png"
                  contorno-interactivo="color: #FFD700; grosor: 1.04">
        </a-entity>

        <a-entity id="cuadernoObjeto2" 
                  gltf-model="#cuaderno"
                  position="21.40 0 -6.882" 
                  scale="0.5 0.5 0.5"
                  rotation="0 1.776 0"
                  class="raycastable"
                  objeto-interactivo="titulo: yo; texto: Antes de todo esto, era un experto en el mantenimiento de alarmas para hogares, por lo que siempre se me hizo fácil y salir sin ser escuchado.; imagen: img/img6.png"
                  contorno-interactivo="color: #FFD700; grosor: 1.04">
        </a-entity>

        <a-entity id="cuadernoObjeto3" 
                  gltf-model="#cuaderno"
                  position="36.34 0 0.883" 
                  scale="0.5 0.5 0.5"
                  rotation="0 -53.5 0"
                  class="raycastable"
                  objeto-interactivo="titulo: soledad; texto: algunos dirian que estoy loco, pero no lo estoy, solo queria estar tranquilo, lejos de todo. ¿por que nadie puede entender lo ruidoso que es el mundo cotidiano?; imagen: img/img8.png"
                  contorno-interactivo="color: #FFD700; grosor: 1.04">
        </a-entity>

         <a-entity id="cuadernoObjeto4" 
                  gltf-model="#cuaderno"
                  position="57.10 0 -4.118" 
                  scale="0.5 0.5 0.5"
                  rotation="0 46.56 0"
                  class="raycastable"
                  objeto-interactivo="texto: solo quiero estar de vuelta en mi hogar; imagen: img/img7.png"
                  contorno-interactivo="color: #FFD700; grosor: 1.04">
        </a-entity>

         <a-entity id="cuadernoObjeto5" 
                  gltf-model="#cuaderno"
                  position="81 0 -0.862" 
                  scale="0.5 0.5 0.5"
                  rotation="0 0 0"
                  class="raycastable"
                  objeto-interactivo="titulo: es hora de despertar Christopher"
                  contorno-interactivo="color: #FFD700; grosor: 1.04">
        </a-entity>

        <a-link href="https://www.youtube.com/watch?v=JbJxpFGD5g0" title="..." position="81.000 1.5 -2.9" rotation="0 -45.7 0" scale="1 1 1"></a-link>

  
  </body>
</html>
